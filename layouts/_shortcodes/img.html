{{/* Image shortcode: responsive + optional caption */}}
{{ $src := .Get "src" }}
{{ $alt := .Get "alt" | default "" }}
{{ $caption := .Get "caption" }}
{{ $width := .Get "width" | default "w-80" }}
<figure class="my-4 tc">
 <img src="{{ $src | relURL }}" alt="{{ $alt }}" class="{{ $width }} br3 shadow-1">
  {{ if $caption }}
    <figcaption class="f6 gray mt2">{{ $caption }}</figcaption>
  {{ end }}
</figure>
